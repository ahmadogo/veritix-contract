[package]
name = "veritix-pay"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
description = "On-chain payment module for the Veritix ticketing platform: token primitives, escrow, recurring payments, splitting, and dispute resolution."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
overflow-checks = true
panic = "abort"
